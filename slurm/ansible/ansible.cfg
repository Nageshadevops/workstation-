[defaults]
# inventory.ini is generated by `make inventory` from the Terraform outputs.
inventory          = inventory.ini
remote_user        = ec2-user
private_key_file   = ~/.ssh/slurm-dev-key
# Servers get new host keys on every re-create; they are only reachable from the workstation.
host_key_checking  = False
# RHEL 9's /usr/bin/python3, no warning about interpreter discovery.
interpreter_python = auto_silent
