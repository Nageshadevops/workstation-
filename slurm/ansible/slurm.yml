# Slurm cluster: slurm-master (controller) + slurm-node-* (compute nodes).
# Run from ~/workstation-/slurm:   make ansible-slurm
# Only one part:                   make ansible-slurm ARGS="--tags base"
# Dry run (changes nothing):       make ansible-slurm ARGS="--check --diff"

# ---------------------------------------------------------------------------
# Step 3.2: base OS on every server
# ---------------------------------------------------------------------------
- name: Base OS
  hosts: all
  become: true # run tasks as root (sudo); ec2-user has passwordless sudo
  tags: base
  tasks:
    # --- hostname and name resolution ---------------------------------------
    - name: Set hostname to the inventory name (slurm-master, slurm-node-1, ...)
      ansible.builtin.hostname:
        name: "{{ inventory_hostname }}"

    - name: Keep the hostname after reboot (cloud-init would reset it)
      ansible.builtin.copy:
        dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
        content: "preserve_hostname: true\n"
        mode: "0644"

    - name: Add every cluster server to /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: "\\s{{ item }}$" # replace the line if the IP changed
        line: "{{ hostvars[item].ansible_host }} {{ item }}"
      loop: "{{ groups['all'] }}"

    # --- swap ------------------------------------------------------------------
    # One task, so later tasks never depend on a file that --check mode did not create.
    - name: Create swap file (root only) and format it
      ansible.builtin.shell: >
        dd if=/dev/zero of=/swapfile bs=1M count={{ swap_size_mb }} &&
        chmod 600 /swapfile &&
        mkswap /swapfile
      args:
        creates: /swapfile # skip if the file already exists

    - name: Turn swap on
      ansible.builtin.command: swapon /swapfile
      when: ansible_facts['swaptotal_mb'] == 0 # no swap active yet

    - name: Turn swap on at boot
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap defaults 0 0"

    # --- security settings ---------------------------------------------------
    # Slurm and munge run from /usr/local and use their own ports; SELinux in
    # enforcing mode blocks them. Same as on-prem.
    - name: SELinux permissive (now and after reboot)
      ansible.posix.selinux:
        state: permissive
        policy: targeted

    # The security group slurm-dev-sg is the firewall. firewalld on the server
    # would block the Slurm ports. RHEL AMIs on AWS usually do not have it.
    - name: List services
      ansible.builtin.service_facts:

    - name: Stop and disable firewalld (if installed)
      ansible.builtin.systemd_service:
        name: firewalld
        state: stopped
        enabled: false
      when: "'firewalld.service' in ansible_facts.services"

    # --- service users ---------------------------------------------------------
    - name: Create munge and slurm groups
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.id }}"
      loop:
        - { name: munge, id: "{{ munge_uid }}" }
        - { name: slurm, id: "{{ slurm_uid }}" }

    - name: Create munge and slurm users (system users, no login)
      ansible.builtin.user:
        name: "{{ item.name }}"
        uid: "{{ item.id }}"
        group: "{{ item.name }}"
        shell: /sbin/nologin
        create_home: false
      loop:
        - { name: munge, id: "{{ munge_uid }}" }
        - { name: slurm, id: "{{ slurm_uid }}" }

# ---------------------------------------------------------------------------
# Step 3.3a: packages on every server
# ---------------------------------------------------------------------------
- name: Packages
  hosts: all
  become: true
  tags: packages
  tasks:
    - name: Enable the CodeReady Builder repo (most -devel packages are there)
      community.general.dnf_config_manager:
        name: "{{ crb_repo }}"
        state: enabled

    - name: Install munge and the libraries Slurm needs (a few minutes on the small nodes)
      ansible.builtin.dnf:
        name: "{{ slurm_packages }}"
        state: present

# ---------------------------------------------------------------------------
# Step 3.3b: munge, the same secret key on every server
# The key is made once on the master and copied to the nodes through Ansible's
# memory (slurp + copy). It is never written to the workstation's disk.
# ---------------------------------------------------------------------------
- name: Munge key on the master
  hosts: master
  become: true
  tags: munge
  tasks:
    # RHEL 9's munge has no "mungekey" command. The key is 1024 random bytes,
    # written as base64 TEXT: munge accepts any content as key, and Ansible can
    # only copy text (raw random bytes would be corrupted on the way).
    - name: Create the munge key (only if it does not exist)
      ansible.builtin.shell: >
        head -c 1024 /dev/urandom | base64 -w0 > /etc/munge/munge.key &&
        chown munge:munge /etc/munge/munge.key &&
        chmod 400 /etc/munge/munge.key
      args:
        creates: /etc/munge/munge.key

    # Needs the real key file, so skipped in a dry run (--check does not create it).
    - name: Read the key into Ansible's memory
      ansible.builtin.slurp:
        src: /etc/munge/munge.key
      register: munge_key
      no_log: true # never print the secret
      when: not ansible_check_mode

- name: Munge on every server
  hosts: all
  become: true
  tags: munge
  tasks:
    - name: Same key on every node
      ansible.builtin.copy:
        content: "{{ hostvars[groups['master'][0]].munge_key.content | b64decode }}"
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: "0400"
      # the master already has it; skipped in a dry run (no key was read)
      when: inventory_hostname not in groups['master'] and not ansible_check_mode
      no_log: true
      notify: Restart munge

    - name: munge owns its folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: munge
        group: munge
      loop: [/etc/munge, /var/log/munge, /var/lib/munge]

    - name: Start munge now and at boot
      ansible.builtin.systemd_service:
        name: munge
        state: started
        enabled: true

  handlers:
    # Handlers run once at the end of the play, only if a task "notified" them.
    - name: Restart munge
      ansible.builtin.systemd_service:
        name: munge
        state: restarted

# Test: a credential made on the master must be accepted by every node.
# That only works if all servers have the same key and roughly the same time.
# Skipped in a dry run: munge is not running yet then.
- name: Munge test
  hosts: all
  become: true
  tags: munge
  tasks:
    - name: Make a credential on the master
      ansible.builtin.command: munge -n
      register: munge_cred
      changed_when: false
      when: inventory_hostname in groups['master'] and not ansible_check_mode

    - name: Decode the master's credential on every server
      ansible.builtin.command:
        cmd: unmunge
        stdin: "{{ hostvars[groups['master'][0]].munge_cred.stdout }}"
      changed_when: false # a test, never a change
      when: not ansible_check_mode

# ---------------------------------------------------------------------------
# Step 3.4a: build Slurm once on the master (same commands as the on-prem notes)
# The nodes have only 1 GB RAM, so they do not compile; they get a copy (3.4b).
# ---------------------------------------------------------------------------
- name: Build Slurm on the master
  hosts: master
  become: true
  tags: build
  vars:
    src_dir: "/root/slurm-{{ slurm_version }}"
  tasks:
    - name: Install compiler and build tools ("Development Tools" group)
      ansible.builtin.dnf:
        name: "@Development Tools"
        state: present

    - name: Download the Slurm source from SchedMD
      ansible.builtin.get_url:
        url: "https://download.schedmd.com/slurm/slurm-{{ slurm_version }}.tar.bz2"
        dest: "{{ src_dir }}.tar.bz2"
        mode: "0644"

    - name: Unpack the source
      ansible.builtin.unarchive:
        src: "{{ src_dir }}.tar.bz2"
        dest: /root
        remote_src: true # the file is on the server, not on the workstation
        creates: "{{ src_dir }}/configure"

    - name: Configure
      ansible.builtin.command: >
        ./configure --prefix={{ slurm_prefix }} --sysconfdir={{ slurm_sysconfdir }}
        --with-munge --enable-debug
      args:
        chdir: "{{ src_dir }}"
        creates: "{{ src_dir }}/config.status"

    # Runs in the background on the server (async) and Ansible checks every 30 s,
    # so a 10-15 minute compile does not depend on one long SSH session.
    - name: Compile and install (10-15 minutes)
      ansible.builtin.shell: >
        make -j$(nproc) && make install && touch {{ slurm_marker }}
      args:
        chdir: "{{ src_dir }}"
        creates: "{{ slurm_marker }}"
      async: 2400 # give up after 40 minutes
      poll: 30

    - name: Pack the installed Slurm for the nodes
      ansible.builtin.command: tar czf /root/slurm-install-{{ slurm_version }}.tgz -C /usr/local slurm
      args:
        creates: /root/slurm-install-{{ slurm_version }}.tgz

    # Through the workstation, because the servers cannot SSH to each other yet.
    # ansible/files/ is git-ignored.
    - name: Copy the package to the workstation (ansible/files/)
      ansible.builtin.fetch:
        src: /root/slurm-install-{{ slurm_version }}.tgz
        dest: files/
        flat: true

# ---------------------------------------------------------------------------
# Step 3.4b: install the same build on the nodes
# ---------------------------------------------------------------------------
- name: Install Slurm on the nodes
  hosts: nodes
  become: true
  tags: build
  tasks:
    - name: Unpack Slurm into /usr/local (from the workstation)
      ansible.builtin.unarchive:
        src: files/slurm-install-{{ slurm_version }}.tgz
        dest: /usr/local
        creates: "{{ slurm_marker }}"

# Test: the right version is on every server.
- name: Slurm build test
  hosts: all
  become: true
  tags: build
  tasks:
    - name: Check the Slurm version
      ansible.builtin.command: "{{ slurm_prefix }}/sbin/slurmd -V"
      register: slurmd_version
      changed_when: false
      failed_when: slurm_version not in slurmd_version.stdout

# ---------------------------------------------------------------------------
# Step 3.5: accounting database on the master
#   slurmctld --> slurmdbd (port 6819) --> MariaDB (port 3306, database slurm_acct_db)
# ---------------------------------------------------------------------------
- name: Accounting database (MariaDB + slurmdbd)
  hosts: master
  become: true
  tags: slurmdbd
  tasks:
    # --- MariaDB -----------------------------------------------------------
    - name: Install MariaDB server
      ansible.builtin.dnf:
        name: mariadb-server
        state: present

    - name: InnoDB settings recommended by SchedMD for slurmdbd
      ansible.builtin.copy:
        dest: /etc/my.cnf.d/innodb.cnf
        content: |
          [mysqld]
          innodb_buffer_pool_size=512M
          innodb_log_file_size=64M
          innodb_lock_wait_timeout=900
          max_allowed_packet=16M
        mode: "0644"
      notify: Restart mariadb

    - name: Start MariaDB now and at boot
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true

    # Apply the InnoDB settings now (handler), before slurmdbd creates its tables.
    - name: Run pending handlers
      ansible.builtin.meta: flush_handlers

    # --- password: generated once on the master, never in git -----------------
    - name: Generate the database password (only if it does not exist)
      ansible.builtin.shell: >
        umask 077 && openssl rand -base64 24 | tr -d '/+=' > {{ slurmdbd_db_password_file }}
      args:
        creates: "{{ slurmdbd_db_password_file }}"

    - name: Read the database password
      ansible.builtin.slurp:
        src: "{{ slurmdbd_db_password_file }}"
      register: db_password_file
      no_log: true

    - name: Keep the password in a variable for the next tasks
      ansible.builtin.set_fact:
        slurmdbd_db_password: "{{ db_password_file.content | b64decode | trim }}"
      no_log: true

    # root logs in to MariaDB through the local socket, no password needed.
    # IF NOT EXISTS + ALTER USER: safe to run again, password always in sync.
    - name: Create the accounting database and its user
      ansible.builtin.command:
        cmd: mysql -u root
        stdin: |
          CREATE DATABASE IF NOT EXISTS {{ slurmdbd_db_name }};
          CREATE USER IF NOT EXISTS '{{ slurmdbd_db_user }}'@'localhost';
          ALTER USER '{{ slurmdbd_db_user }}'@'localhost' IDENTIFIED BY '{{ slurmdbd_db_password }}';
          GRANT ALL ON {{ slurmdbd_db_name }}.* TO '{{ slurmdbd_db_user }}'@'localhost';
          FLUSH PRIVILEGES;
      changed_when: false
      no_log: true

    # --- slurmdbd ------------------------------------------------------------
    - name: Create Slurm config and log folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: slurm
        group: slurm
        mode: "0755"
      loop:
        - "{{ slurm_sysconfdir }}"
        - /var/log/slurm

    - name: Write slurmdbd.conf (contains the password, so only slurm can read it)
      ansible.builtin.template:
        src: templates/slurmdbd.conf.j2
        dest: "{{ slurm_sysconfdir }}/slurmdbd.conf"
        owner: slurm
        group: slurm
        mode: "0600"
      diff: false # never show the file (with the password) in --diff output
      notify: Restart slurmdbd

    - name: Install the slurmdbd systemd service
      ansible.builtin.template:
        src: templates/slurmdbd.service.j2
        dest: /etc/systemd/system/slurmdbd.service
        mode: "0644"
      notify: Restart slurmdbd

    - name: Start slurmdbd now and at boot
      ansible.builtin.systemd_service:
        name: slurmdbd
        state: started
        enabled: true
        daemon_reload: true # systemd reads the new .service file

    - name: Wait until slurmdbd listens on port {{ slurmdbd_port }}
      ansible.builtin.wait_for:
        port: "{{ slurmdbd_port }}"
        timeout: 60

  handlers:
    - name: Restart mariadb
      ansible.builtin.systemd_service:
        name: mariadb
        state: restarted

    - name: Restart slurmdbd
      ansible.builtin.systemd_service:
        name: slurmdbd
        state: restarted
        daemon_reload: true

# ---------------------------------------------------------------------------
# Step 3.6: slurm.conf + services on every server
#   slurm-master  -> slurmctld (controller)
#   slurm-node-*  -> slurmd    (runs the jobs)
# slurm_service comes from group_vars/master.yml or group_vars/nodes.yml.
# ---------------------------------------------------------------------------
- name: Configure and start Slurm
  hosts: all
  become: true
  tags: config
  tasks:
    - name: Create Slurm folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: slurm
        group: slurm
        mode: "0755"
      loop:
        - "{{ slurm_sysconfdir }}"
        - /var/spool/slurmctld # controller state (used on the master)
        - /var/spool/slurmd # node state (used on the nodes)
        - /var/log/slurm

    # One template, same result on every server (Slurm requires identical files).
    - name: Write slurm.conf
      ansible.builtin.template:
        src: templates/slurm.conf.j2
        dest: "{{ slurm_sysconfdir }}/slurm.conf"
        owner: slurm
        group: slurm
        mode: "0644"
      notify: Restart Slurm

    - name: Write cgroup.conf (RHEL 9 uses cgroup v2; autodetect finds it)
      ansible.builtin.copy:
        dest: "{{ slurm_sysconfdir }}/cgroup.conf"
        content: "CgroupPlugin=autodetect\n"
        owner: slurm
        group: slurm
        mode: "0644"
      notify: Restart Slurm

    - name: Put the Slurm commands on every user's PATH
      ansible.builtin.copy:
        dest: /etc/profile.d/slurm.sh
        content: "export PATH={{ slurm_prefix }}/bin:{{ slurm_prefix }}/sbin:$PATH\n"
        mode: "0644"

    - name: Install the {{ slurm_service }} systemd service
      ansible.builtin.template:
        src: "templates/{{ slurm_service }}.service.j2"
        dest: "/etc/systemd/system/{{ slurm_service }}.service"
        mode: "0644"
      notify: Restart Slurm

    - name: Start {{ slurm_service }} now and at boot
      ansible.builtin.systemd_service:
        name: "{{ slurm_service }}"
        state: started
        enabled: true
        daemon_reload: true

  handlers:
    - name: Restart Slurm
      ansible.builtin.systemd_service:
        name: "{{ slurm_service }}"
        state: restarted
        daemon_reload: true

# Test: all nodes must register with the controller and become "idle".
- name: Slurm cluster test
  hosts: master
  become: true
  tags: config
  tasks:
    - name: Wait until every node is idle (up to 2 minutes)
      ansible.builtin.command: "{{ slurm_prefix }}/bin/sinfo --noheader --states=idle --format=%D"
      register: idle_nodes
      changed_when: false
      until: idle_nodes.stdout | trim == groups['nodes'] | length | string
      retries: 24
      delay: 5

    - name: Show sinfo
      ansible.builtin.command: "{{ slurm_prefix }}/bin/sinfo"
      register: sinfo
      changed_when: false

    - name: Print sinfo
      ansible.builtin.debug:
        var: sinfo.stdout_lines
